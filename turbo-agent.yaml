log_dir: default  # request logs go to .turbo-agent/<log_dir>/

backend:
  models:
    - name: openai/deepseek-v4.1-flash     # OpenCode Go model id
      base_url: https://opencode.ai/inference/go/openai/v1
      api_key: $OPENCODE_API_KEY
      extra_headers:
        User-Agent: turbo-agent/0.2
        x-opencode-session: $OPENCODE_SESSION_ID
      num_candidates: 5        # parallel candidate responses per request
      temperature: 1
      thinking: high
      max_tokens: 65536

verifier:
  model:
    name: openai/deepseek-v4.1-flash        # verifier needs logprobs; DeepSeek via Go
    base_url: https://opencode.ai/inference/go/openai/v1
    api_key: $OPENCODE_API_KEY
    extra_headers:
      User-Agent: turbo-agent/0.2
      x-opencode-session: $OPENCODE_SESSION_ID

  majority_voting: true        # skip the tournament when candidates agree

  method:
    name: pivot_tournament
    pivots: 1                  # k: number of pivot candidates
    n_verifications: 2         # K: repeated verifications per directed pair
    seed: 0
    note: >-
      There is no reference solution available. Judge each trajectory purely on
      how plausibly it solved the task correctly.
    criteria:
      - name: Task Success
        description: >-
          How likely the agent correctly and completely solved the task. The
          strongest signal is the agent verifying its solution against the
          task's specific requirements. Trajectory length, number of steps, and
          apparent confidence do not predict correctness.
